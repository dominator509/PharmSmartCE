[project]
name = "pharmsmartce-api"
version = "0.1.0"
description = "FastAPI backend for PharmSmartCE."
requires-python = ">=3.11,<3.12"
dependencies = [
  "argon2-cffi==23.1.0",
  "alembic==1.13.3",
  "asyncpg==0.31.0",
  "faiss-cpu==1.14.3",
  "fastapi==0.138.1",
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "prometheus-client==0.25.0",
  "python-magic==0.4.27; platform_system != 'Windows'",
  "python-magic-bin==0.4.14; platform_system == 'Windows'",
  "python-multipart==0.0.32",
  "sentry-sdk==2.63.0",
  "sqlalchemy==2.0.36",
  "structlog==24.4.0",
  "uvicorn[standard]==0.32.0",
]

[dependency-groups]
dev = [
  "mypy==1.13.0",
  "pip-audit==2.7.3",
  "pytest==9.1.1",
  "pytest-cov==5.0.0",
  "pytest-rerunfailures==16.3",
  "ruff==0.7.4",
  "testcontainers==4.14.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --reruns 2"
pythonpath = ["."]
cache_dir = ".tools/pytest-cache"
markers = [
  "flaky: rerun-failures controlled by pytest-rerunfailures",
  "quarantine: excluded from CI until redesigned",
  "llm_smoke: exercises the real model and is excluded from CI",
]
