app = "pharmsmartce-web"
primary_region = "sjc"

[build]
  dockerfile = "apps/web/Dockerfile"

[deploy]
  strategy = "bluegreen"

[processes]
  web = "node server.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  processes = ["web"]
