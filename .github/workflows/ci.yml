name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: pharm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d pharm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PYTEST_ADDOPTS: -m "not quarantine"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Install dependencies
        run: scripts/install.sh

      - name: Verify
        run: scripts/verify.sh
